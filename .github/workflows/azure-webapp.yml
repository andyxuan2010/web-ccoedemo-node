name: Build and Deploy Web App

on:
  push:
    branches:
      - main
      - dev
      - sbx
  pull_request:
    branches:
      - main
      - dev
      - sbx
  workflow_dispatch:
    inputs:
      deploy:
        description: Run Azure App Service deployment after build
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: "24.x"
  WINDOWS_NODE_VERSION: "~24"
  LINUX_NODE_RUNTIME_STACK: "NODE|24-lts"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PACKAGE_ROOT: ${{ github.workspace }}/package
  PACKAGE_PATH: ${{ github.workspace }}/app.zip
  WEBAPP_NAME_PRIMARY_MAIN: web-platform-eus-prod-node
  WEBAPP_NAME_PRIMARY_DEV: web-platform-eus-dev-node
  WEBAPP_NAME_PRIMARY_SBX: web-platform-cc-sbx-node
  WEBAPP_NAME_SECONDARY: ""

jobs:
  deployment-precheck:
    name: Deployment Precheck
    runs-on: ubuntu-latest
    environment: ${{ vars.DEPLOY_ENV }}
    outputs:
      has_deploy_auth: ${{ steps.check.outputs.has_deploy_auth }}
      branch_name: ${{ steps.check.outputs.branch_name }}
      deploy_env: ${{ steps.check.outputs.deploy_env }}
    steps:
      - name: Check deploy authentication inputs
        id: check
        shell: bash
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          AZURE_CLIENT_ID_NONPROD: ${{ secrets.AZURE_CLIENT_ID_NONPROD }}
          AZURE_CLIENT_ID_SBX: ${{ secrets.AZURE_CLIENT_ID_SBX }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          AZURE_TENANT_ID_NONPROD: ${{ secrets.AZURE_TENANT_ID_NONPROD }}
          AZURE_TENANT_ID_SBX: ${{ secrets.AZURE_TENANT_ID_SBX }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          AZURE_SUBSCRIPTION_ID_NONPROD: ${{ secrets.AZURE_SUBSCRIPTION_ID_NONPROD }}
          AZURE_SUBSCRIPTION_ID_SBX: ${{ secrets.AZURE_SUBSCRIPTION_ID_SBX }}
          DEPLOY_ENV_CONFIGURED: ${{ vars.DEPLOY_ENV }}
          WEBAPP_NAME_PRIMARY_CONFIGURED: ${{ vars.WEBAPP_NAME_PRIMARY }}
        run: |
          set -euo pipefail

          branch_name="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

          case "${branch_name}" in
            main)
              deploy_env="${DEPLOY_ENV_CONFIGURED}"
              client_id="${ARM_CLIENT_ID}"
              tenant_id="${ARM_TENANT_ID}"
              subscription_id="${ARM_SUBSCRIPTION_ID}"
              primary_app="${WEBAPP_NAME_PRIMARY_CONFIGURED}"
              ;;
            dev)
              deploy_env="dev"
              client_id="${AZURE_CLIENT_ID_NONPROD}"
              tenant_id="${AZURE_TENANT_ID_NONPROD}"
              subscription_id="${AZURE_SUBSCRIPTION_ID_NONPROD}"
              primary_app="${WEBAPP_NAME_PRIMARY_DEV}"
              ;;
            sbx)
              deploy_env="sbx"
              client_id="${AZURE_CLIENT_ID_SBX}"
              tenant_id="${AZURE_TENANT_ID_SBX}"
              subscription_id="${AZURE_SUBSCRIPTION_ID_SBX}"
              primary_app="${WEBAPP_NAME_PRIMARY_SBX}"
              ;;
            *)
              deploy_env="unsupported"
              client_id=""
              tenant_id=""
              subscription_id=""
              primary_app=""
              ;;
          esac

          echo "branch_name=${branch_name}" >> "${GITHUB_OUTPUT}"
          echo "deploy_env=${deploy_env}" >> "${GITHUB_OUTPUT}"

          missing=()
          [[ -n "${client_id}" ]] || missing+=("client_id")
          [[ -n "${tenant_id}" ]] || missing+=("tenant_id")
          [[ -n "${subscription_id}" ]] || missing+=("subscription_id")
          [[ -n "${primary_app}" ]] || missing+=("primary_app")

          if [[ "${deploy_env}" == "unsupported" ]]; then
            echo "has_deploy_auth=false" >> "${GITHUB_OUTPUT}"
            echo "Unsupported branch '${branch_name}' for deployment."
          elif [[ ${#missing[@]} -eq 0 ]]; then
            echo "has_deploy_auth=true" >> "${GITHUB_OUTPUT}"
            echo "Deploy auth precheck passed for '${branch_name}' using env '${deploy_env}'."
          else
            echo "has_deploy_auth=false" >> "${GITHUB_OUTPUT}"
            echo "Missing deploy authentication inputs for '${branch_name}': ${missing[*]}"
          fi

  build-package:
    name: Build Package
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.context.outputs.branch_name }}
      deploy_env: ${{ steps.context.outputs.deploy_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve branch context
        id: context
        shell: bash
        run: |
          set -euo pipefail
          branch_name="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

          case "${branch_name}" in
            main)
              deploy_env="prod"
              ;;
            dev)
              deploy_env="dev"
              ;;
            sbx)
              deploy_env="sbx"
              ;;
            *)
              deploy_env="dev"
              ;;
          esac

          echo "branch_name=${branch_name}" >> "${GITHUB_OUTPUT}"
          echo "deploy_env=${deploy_env}" >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Validate app syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js

      - name: Stage application files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${PACKAGE_ROOT}" "${PACKAGE_PATH}"
          mkdir -p "${PACKAGE_ROOT}"

          cp app.js "${PACKAGE_ROOT}/"
          cp package.json "${PACKAGE_ROOT}/"
          cp package-lock.json "${PACKAGE_ROOT}/"
          cp web.config "${PACKAGE_ROOT}/"
          cp -R views "${PACKAGE_ROOT}/views"
          cp -R static "${PACKAGE_ROOT}/static"

      - name: Archive application
        shell: bash
        run: |
          set -euo pipefail
          cd "${PACKAGE_ROOT}"
          zip -r "${PACKAGE_PATH}" .

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-package-${{ github.run_id }}
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error

  create-git-tag:
    name: Create Git Tag
    needs:
      - build-package
    if: github.event_name != 'pull_request' && needs.build-package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.semver.outputs.release_tag }}
      release_notes: ${{ steps.semver.outputs.release_notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create canonical GitHub release tag
        id: semver
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          release_tag_file="$(mktemp)"
          release_notes_file="$(mktemp)"

          bash scripts/create-release-tag.sh \
            --source-branch "${SOURCE_BRANCH}" \
            --source-sha "${SOURCE_SHA}" \
            --release-tag-file "${release_tag_file}" \
            --release-notes-file "${release_notes_file}"

          {
            echo "release_tag=$(cat "${release_tag_file}")"
            echo "release_notes<<EOF"
            cat "${release_notes_file}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
  pre-publish-check:
    name: Pre-Publish Check
    runs-on: ubuntu-latest
    outputs:
      should_publish_stage_repo: ${{ steps.check.outputs.should_publish_stage_repo }}
      should_publish_ado_repo: ${{ steps.check.outputs.should_publish_ado_repo }}
    steps:
      - name: Check publish authentication inputs
        id: check
        shell: bash
        env:
          STAGE_REPO_URL: ${{ vars.STAGE_REPO_URL }}
          STAGE_REPO_TOKEN: ${{ secrets.STAGE_REPO_TOKEN }}
          ADO_REPO_URL: ${{ vars.ADO_REPO_URL }}
          ADO_REPO_PAT: ${{ secrets.ADO_REPO_PAT }}
        run: |
          set -euo pipefail

          if [[ -z "${STAGE_REPO_URL}" || -z "${STAGE_REPO_TOKEN}" ]]; then
            echo "::warning::Missing stage mirror configuration: STAGE_REPO_URL and/or STAGE_REPO_TOKEN. Stage repo publish will be skipped."
            echo "should_publish_stage_repo=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should_publish_stage_repo=true" >> "${GITHUB_OUTPUT}"
          fi

          if [[ -z "${ADO_REPO_URL}" || -z "${ADO_REPO_PAT}" ]]; then
            echo "::warning::Missing Azure DevOps mirror configuration: ADO_REPO_URL and/or ADO_REPO_PAT. Azure DevOps publish will be skipped."
            echo "should_publish_ado_repo=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should_publish_ado_repo=true" >> "${GITHUB_OUTPUT}"
          fi

  deploy:
    name: Deploy
    needs:
      - deployment-precheck
      - build-package
    if: >
      github.event_name != 'pull_request' &&
      needs.deployment-precheck.outputs.has_deploy_auth == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy)
    runs-on: ubuntu-latest
    environment: ${{ vars.DEPLOY_ENV }}
    outputs:
      deploy_branch: ${{ steps.context.outputs.branch_name }}
    steps:
      - name: Resolve branch context
        id: context
        shell: bash
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          AZURE_CLIENT_ID_NONPROD: ${{ secrets.AZURE_CLIENT_ID_NONPROD }}
          AZURE_CLIENT_ID_SBX: ${{ secrets.AZURE_CLIENT_ID_SBX }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          AZURE_TENANT_ID_NONPROD: ${{ secrets.AZURE_TENANT_ID_NONPROD }}
          AZURE_TENANT_ID_SBX: ${{ secrets.AZURE_TENANT_ID_SBX }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          AZURE_SUBSCRIPTION_ID_NONPROD: ${{ secrets.AZURE_SUBSCRIPTION_ID_NONPROD }}
          AZURE_SUBSCRIPTION_ID_SBX: ${{ secrets.AZURE_SUBSCRIPTION_ID_SBX }}
          DEPLOY_ENV_CONFIGURED: ${{ vars.DEPLOY_ENV }}
          WEBAPP_NAME_PRIMARY_CONFIGURED: ${{ vars.WEBAPP_NAME_PRIMARY }}
        run: |
          set -euo pipefail
          branch_name="${GITHUB_REF_NAME}"

          case "${branch_name}" in
            main)
              deploy_env="${DEPLOY_ENV_CONFIGURED}"
              client_id="${ARM_CLIENT_ID}"
              tenant_id="${ARM_TENANT_ID}"
              subscription_id="${ARM_SUBSCRIPTION_ID}"
              primary_app="${WEBAPP_NAME_PRIMARY_CONFIGURED}"
              ;;
            dev)
              deploy_env="dev"
              client_id="${AZURE_CLIENT_ID_NONPROD}"
              tenant_id="${AZURE_TENANT_ID_NONPROD}"
              subscription_id="${AZURE_SUBSCRIPTION_ID_NONPROD}"
              primary_app="${WEBAPP_NAME_PRIMARY_DEV}"
              ;;
            sbx)
              deploy_env="sbx"
              client_id="${AZURE_CLIENT_ID_SBX}"
              tenant_id="${AZURE_TENANT_ID_SBX}"
              subscription_id="${AZURE_SUBSCRIPTION_ID_SBX}"
              primary_app="${WEBAPP_NAME_PRIMARY_SBX}"
              ;;
            *)
              echo "Unsupported branch '${branch_name}' for deployment." >&2
              exit 1
              ;;
          esac

          {
            echo "AZURE_CLIENT_ID=${client_id}"
            echo "AZURE_TENANT_ID=${tenant_id}"
            echo "AZURE_SUBSCRIPTION_ID=${subscription_id}"
            echo "DEPLOY_ENV=${deploy_env}"
            echo "WEBAPP_NAME_PRIMARY=${primary_app}"
          } >> "${GITHUB_ENV}"

          echo "branch_name=${branch_name}" >> "${GITHUB_OUTPUT}"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-package-${{ github.run_id }}
          path: ${{ github.workspace }}/artifact

      - name: Deploy published ZIP packages
        shell: bash
        env:
          PACKAGE_PATH: ${{ github.workspace }}/artifact/app.zip
        run: |
          set -euo pipefail

          test_scm_connectivity() {
            local host_name="$1"

            echo "Starting SCM connectivity preflight for ${host_name}..."

            if getent ahosts "${host_name}" > /tmp/scm_dns.txt 2>/tmp/scm_dns_err.txt; then
              awk '!seen[$1 FS $2]++ { printf("SCM resolved address [%s]: %s\n", $2, $1) }' /tmp/scm_dns.txt
            else
              cat /tmp/scm_dns_err.txt || true
              if command -v nslookup >/dev/null 2>&1; then
                nslookup "${host_name}" || true
              fi
              echo "Failed to resolve ${host_name} from the GitHub runner." >&2
              exit 1
            fi

            echo "SCM TCP probe: testing ${host_name}:443"
            if ! timeout 10 bash -c "cat < /dev/null > /dev/tcp/${host_name}/443" 2>/tmp/scm_tcp_err.txt; then
              cat /tmp/scm_tcp_err.txt || true
              echo "Failed to reach https://${host_name} from the GitHub runner." >&2
              exit 1
            fi
          }

          deploy_target() {
            local app_name="$1"

            if [ -z "${app_name}" ]; then
              echo "Deployment target is blank. Skipping."
              return 0
            fi

            local app_id
            local subscription_id
            local resource_group
            local scm_host
            local app_os

            app_id="$(az resource list --name "${app_name}" --resource-type "Microsoft.Web/sites" --query "[0].id" --output tsv)"
            if [ -z "${app_id}" ]; then
              echo "App Service '${app_name}' was not found. Skipping deployment."
              return 0
            fi

            subscription_id="$(echo "${app_id}" | cut -d/ -f3)"
            resource_group="$(echo "${app_id}" | cut -d/ -f5)"
            scm_host="${app_name}.scm.azurewebsites.net"

            echo "Deploying ZIP package with build automation to ${app_name}..."
            az account set --subscription "${subscription_id}"
            test_scm_connectivity "${scm_host}"

            app_os="$(az webapp show --resource-group "${resource_group}" --name "${app_name}" --query reserved --output tsv | tr '[:upper:]' '[:lower:]')"
            echo "Detected reserved value for ${app_name}: ${app_os}"

            if [ "${app_os}" = "true" ]; then
              az webapp config set \
                --resource-group "${resource_group}" \
                --name "${app_name}" \
                --linux-fx-version "${LINUX_NODE_RUNTIME_STACK}" \
                --startup-file "npm start"

              az webapp config appsettings delete \
                --resource-group "${resource_group}" \
                --name "${app_name}" \
                --setting-names WEBSITE_NODE_DEFAULT_VERSION WEBSITE_RUN_FROM_PACKAGE || true
            elif [ "${app_os}" = "false" ]; then
              az webapp config appsettings delete \
                --resource-group "${resource_group}" \
                --name "${app_name}" \
                --setting-names WEBSITE_RUN_FROM_PACKAGE || true

              az webapp config appsettings set \
                --resource-group "${resource_group}" \
                --name "${app_name}" \
                --settings WEBSITE_NODE_DEFAULT_VERSION="${WINDOWS_NODE_VERSION}"
            else
              echo "Unexpected reserved value '${app_os}' for '${app_name}'. Continuing with neutral ZIP deployment." >&2
            fi

            az webapp config appsettings set \
              --resource-group "${resource_group}" \
              --name "${app_name}" \
              --settings \
                SCM_DO_BUILD_DURING_DEPLOYMENT=true \
                ENABLE_ORYX_BUILD=true \
                APP_SERVICE_NAME="${app_name}" \
                APP_SERVICE_SUBSCRIPTION_ID="${subscription_id}" \
                APP_SERVICE_RESOURCE_GROUP="${resource_group}"

            az webapp deploy \
              --resource-group "${resource_group}" \
              --name "${app_name}" \
              --src-path "${PACKAGE_PATH}" \
              --type zip \
              --restart true \
              --track-status false
          }

          deploy_target "${WEBAPP_NAME_PRIMARY}"
          deploy_target "${WEBAPP_NAME_SECONDARY}"

  publish-stage-repo:
    name: Publish Github Repo
    needs:
      - build-package
      - create-git-tag
      - pre-publish-check
    if: github.event_name != 'pull_request' && needs.build-package.result == 'success' && needs.pre-publish-check.outputs.should_publish_stage_repo == 'true' && (needs.create-git-tag.result == 'success' || needs.create-git-tag.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Publish clean snapshot to stage repo
        env:
          STAGE_REPO_URL: ${{ vars.STAGE_REPO_URL }}
          STAGE_REPO_TOKEN: ${{ secrets.STAGE_REPO_TOKEN }}
          SOURCE_BRANCH: ${{ needs.build-package.outputs.branch_name }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.create-git-tag.outputs.release_tag }}
          RELEASE_NOTES: ${{ needs.create-git-tag.outputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT

          rsync -a \
            --exclude='.git' \
            "${GITHUB_WORKSPACE}/" "${workdir}/repo/"

          cd "${workdir}/repo"

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${SOURCE_BRANCH}"
          git add .
          git commit -m "Stage snapshot from ${SOURCE_BRANCH}@${SOURCE_SHA}"

          if [[ -n "${RELEASE_TAG}" ]]; then
            release_notes="${RELEASE_NOTES:-}"
            if [[ -z "${release_notes}" ]]; then
              release_notes="- ${SOURCE_SHA}"
            fi

            tag_message="$(mktemp)"
            {
              echo "Release ${RELEASE_TAG} snapshot"
              echo
              echo "Source: ${SOURCE_BRANCH}@${SOURCE_SHA}"
              echo
              echo "Changes:"
              printf '%s\n' "${release_notes}"
            } > "${tag_message}"

            git tag -a "${RELEASE_TAG}" -F "${tag_message}"
          fi

          target_repo="${STAGE_REPO_URL#https://}"
          git remote add origin "https://x-access-token:${STAGE_REPO_TOKEN}@${target_repo}.git"
          git push --force origin "${SOURCE_BRANCH}"
          if [[ -n "${RELEASE_TAG}" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "Stage repo already has tag ${RELEASE_TAG}; leaving it unchanged."
            else
              git push origin "refs/tags/${RELEASE_TAG}"
            fi
          fi

  publish-ado-repo:
    name: Publish ADO Repo
    needs:
      - build-package
      - create-git-tag
      - pre-publish-check
    if: github.event_name != 'pull_request' && needs.build-package.result == 'success' && needs.pre-publish-check.outputs.should_publish_ado_repo == 'true' && (needs.create-git-tag.result == 'success' || needs.create-git-tag.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Publish clean snapshot to Azure DevOps repo
        env:
          ADO_REPO_URL: ${{ vars.ADO_REPO_URL }}
          ADO_REPO_PAT: ${{ secrets.ADO_REPO_PAT }}
          SOURCE_BRANCH: ${{ needs.build-package.outputs.branch_name }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.create-git-tag.outputs.release_tag }}
          RELEASE_NOTES: ${{ needs.create-git-tag.outputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT

          rsync -a \
            --exclude='.git' \
            "${GITHUB_WORKSPACE}/" "${workdir}/repo/"

          cd "${workdir}/repo"

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${SOURCE_BRANCH}"
          git add .
          git commit -m "ADO snapshot from ${SOURCE_BRANCH}@${SOURCE_SHA}"

          if [[ -n "${RELEASE_TAG}" ]]; then
            release_notes="${RELEASE_NOTES:-}"
            if [[ -z "${release_notes}" ]]; then
              release_notes="- ${SOURCE_SHA}"
            fi

            tag_message="$(mktemp)"
            {
              echo "Release ${RELEASE_TAG} snapshot"
              echo
              echo "Source: ${SOURCE_BRANCH}@${SOURCE_SHA}"
              echo
              echo "Changes:"
              printf '%s\n' "${release_notes}"
            } > "${tag_message}"

            git tag -a "${RELEASE_TAG}" -F "${tag_message}"
          fi

          target_repo="${ADO_REPO_URL#https://}"
          git remote add origin "https://ado:${ADO_REPO_PAT}@${target_repo}"
          git push --force origin "${SOURCE_BRANCH}"
          if [[ -n "${RELEASE_TAG}" ]]; then
            git push --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          fi
